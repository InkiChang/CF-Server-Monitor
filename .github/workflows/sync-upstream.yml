name: Sync Upstream

on:
  schedule:
    - cron: '17 */6 * * *'   # 每6小时同步一次(避开整点高峰)
  workflow_dispatch: {}      # 支持手动触发

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork with upstream
        run: gh repo sync "$GITHUB_REPOSITORY" --source huilang-me/CF-Server-Monitor --branch main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Show result
        run: |
          echo "Synced $(date -u) -> $(git ls-remote https://github.com/InkiChang/CF-Server-Monitor.git main | cut -c1-8)  (upstream: $(git ls-remote https://github.com/huilang-me/CF-Server-Monitor.git main | cut -c1-8))"